services:
  provider-fake:
    build: ./provider-fake
    env_file:
      - path: .env
        required: false
    ports:
      - "8090:8090"

  hr-fake:
    build: ./hr-fake
    ports:
      - "8091:8091"

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: vereda
      POSTGRES_PASSWORD: vereda
      POSTGRES_DB: vereda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vereda -d vereda"]
      interval: 2s
      timeout: 3s
      retries: 30

  jaeger:
    image: jaegertracing/jaeger:2.16.0
    ports:
      - "16686:16686"

  app:
    build: ./app
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://vereda:vereda@postgres:5432/vereda
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 3s
      retries: 60
    depends_on:
      postgres:
        condition: service_healthy
      provider-fake:
        condition: service_healthy
      hr-fake:
        condition: service_healthy
      jaeger:
        condition: service_started

  edge:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:

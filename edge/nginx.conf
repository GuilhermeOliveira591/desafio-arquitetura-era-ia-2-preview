# Edge: a borda da plataforma. Não altere este arquivo.
# É a porta de entrada oficial do assistente em http://localhost:8000.
#
# A autenticação real fica fora do desafio. A borda a simula: cada token
# conhecido identifica uma empresa (tenant), um colaborador e um papel, e a
# borda repassa essa identidade para a aplicação em headers. Headers de
# identidade enviados pelo cliente são sempre sobrescritos.

map $http_authorization $vereda_tenant {
    default              "";
    "Bearer tok-ana"     estrela;
    "Bearer tok-carlos"  estrela;
    "Bearer tok-rh-estrela" estrela;
    "Bearer tok-bruno"   boreal;
    "Bearer tok-daniela" boreal;
    "Bearer tok-rh-boreal"  boreal;
}

map $http_authorization $vereda_employee {
    default              "";
    "Bearer tok-ana"     E001;
    "Bearer tok-carlos"  E002;
    "Bearer tok-bruno"   B001;
    "Bearer tok-daniela" B002;
}

map $http_authorization $vereda_role {
    default              "";
    "Bearer tok-ana"     employee;
    "Bearer tok-carlos"  employee;
    "Bearer tok-bruno"   employee;
    "Bearer tok-daniela" employee;
    "Bearer tok-rh-estrela" hr;
    "Bearer tok-rh-boreal"  hr;
}

server {
    listen 80;

    # O DNS interno do Docker resolve o nome "app" em tempo de requisição.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://app:8080;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    location = /health {
        proxy_pass $upstream;
    }

    location / {
        if ($vereda_tenant = "") {
            return 401;
        }
        # Num location com proxy_set_header próprio, os do server não são herdados.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Id $vereda_tenant;
        proxy_set_header X-Employee-Id $vereda_employee;
        proxy_set_header X-Role $vereda_role;
        proxy_set_header Authorization "";
        proxy_pass $upstream;
    }
}
